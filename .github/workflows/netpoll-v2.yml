name: ogrenet

on:
  push:
    branches: [master, feat/unified-transport-security]
  pull_request:

permissions:
  contents: read

jobs:
  linux:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        go: ["1.25.x", "1.26.x"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ matrix.go }}
          cache: true
      - name: Format
        run: |
          gofmt -w .
          git diff --exit-code
      - name: Module hygiene
        run: go mod tidy && git diff --exit-code -- go.mod go.sum
      - name: Vet
        run: go vet ./...
      - name: HTTP protocol facade benchmark smoke
        run: go test ./client -run '^$' -bench 'BenchmarkHTTPProtocolFacade' -benchtime=1x
      - name: Runtime timeout benchmark smoke
        run: go test ./transport -run '^$' -bench 'Benchmark(ActivityClockTouch|StreamTimeoutPolicyDisabled)' -benchmem -benchtime=1x
      - name: Graceful lifecycle allocation gate
        env:
          GO_MATRIX_VERSION: ${{ matrix.go }}
        run: |
          output="$(go test ./transport -run '^$' -bench 'BenchmarkGraceful(SendRunning|TrySendRunning)' -benchmem -benchtime=1x -count=5)"
          printf '%s\n' "$output"
          if [[ "$GO_MATRIX_VERSION" == "1.25.x" ]]; then
            send_limit=29
          else
            send_limit=17
          fi
          printf '%s\n' "$output" | awk -v send_limit="$send_limit" -v try_limit=4 '
            /BenchmarkGracefulSendRunning/ {
              alloc = $(NF-1) + 0
              seen_send++
              if (alloc > send_limit) {
                printf "SendRunning allocation regression: %d > %d allocs/op\n", alloc, send_limit > "/dev/stderr"
                bad = 1
              }
            }
            /BenchmarkGracefulTrySendRunning/ {
              alloc = $(NF-1) + 0
              seen_try++
              if (alloc > try_limit) {
                printf "TrySendRunning allocation regression: %d > %d allocs/op\n", alloc, try_limit > "/dev/stderr"
                bad = 1
              }
            }
            END {
              if (seen_send != 5 || seen_try != 5) {
                printf "expected 5 SendRunning and 5 TrySendRunning samples, got %d and %d\n", seen_send, seen_try > "/dev/stderr"
                bad = 1
              }
              exit bad
            }'
      - name: Graceful drain benchmark smoke
        run: >-
          go test ./transport -run '^$'
          -bench 'BenchmarkGraceful(DrainOneFrame|Drain256Frames)'
          -benchmem -benchtime=1x
      - name: Error taxonomy benchmark smoke
        run: >-
          go test ./transport -run '^$'
          -bench 'BenchmarkError(WrapKnown|WrapUnknown|ClassifyReset|ClassifyTimeout)'
          -benchmem -benchtime=1x
      - name: Observability allocation gate
        run: |
          output="$(go test ./transport -run '^$' -bench 'BenchmarkObserver|Benchmark(Session|Packet|Engine)StatsSnapshot' -benchmem -benchtime=100x -count=3)"
          printf '%s\n' "$output"
          printf '%s\n' "$output" | awk '
            /BenchmarkObserverDisabledEmitPath|BenchmarkSessionStatsSnapshot|BenchmarkPacketStatsSnapshot|BenchmarkEngineStatsSnapshot/ {
              alloc = $(NF-1) + 0
              seen++
              if (alloc != 0) {
                printf "%s allocation regression: %d allocs/op, want 0\n", $1, alloc > "/dev/stderr"
                bad = 1
              }
            }
            END {
              if (seen != 12) {
                printf "expected 12 deterministic observability allocation samples, got %d\n", seen > "/dev/stderr"
                bad = 1
              }
              exit bad
            }'
      - name: Typed error ownership race loop
        if: matrix.go == '1.26.x'
        run: go test -race ./transport -run '^TestTransportErrorRace' -count=20
      - name: Observability race loop
        if: matrix.go == '1.26.x'
        run: go test -race ./transport -run '^TestObservabilityRace' -count=20
      - name: Runtimecore ownership race loop
        if: matrix.go == '1.26.x'
        run: go test -race ./internal/runtimecore -count=20
      - name: Native epoll dial race loop
        if: matrix.go == '1.26.x'
        run: go test -race ./transport -run '^TestEpollNativeDial' -count=20
      - name: Native epoll send race loop
        if: matrix.go == '1.26.x'
        run: go test -race ./transport -run '^TestEpollNative(Send|TrySend|Partial|Write)' -count=20
      - name: Native epoll lifecycle race loop
        if: matrix.go == '1.26.x'
        run: go test -race ./transport -run '^TestEpollNative(Close|Shutdown|PeerFIN|Lifecycle)' -count=20
      - name: Native epoll read/callback race loop
        if: matrix.go == '1.26.x'
        run: go test -race ./transport -run '^TestEpollNative(OnOpen|Decoded|StatsAndObserverRead|BlockedHandler|OneSession|DoneWaits|Callback)|^TestEpollPublicTCPContracts' -count=20
      - name: Native epoll TCP parity race loop
        if: matrix.go == '1.26.x'
        run: go test -race ./transport -run '^TestEpoll.*(Parity|Graceful|Observer|Stats|Limit|Timeout|Error)' -count=20
      - name: Test with race detector
        run: go test -race -count=1 ./...

  windows:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.26.x"
          cache: true
      - run: go vet ./...
      - run: go test -count=1 ./...

  macos:
    runs-on: macos-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.26.x"
          cache: true
      - run: go vet ./...
      - run: go test -count=1 ./...

  freebsd-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - name: Test transport error classifier on FreeBSD
        uses: vmactions/freebsd-vm@77ed28d336d03fe19a3f4f7266c1d2c4714dd79d
        with:
          release: "14.4"
          usesh: true
          prepare: |
            pkg install -y go126
          run: |
            go126 version
            go126 test ./transport -run 'Test(ClassifyPlatformCauseUnix|TransportError(TCP|UDP|Resource|Listener))' -count=1

  gmssl:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.26.x"
          cache: true
      - uses: actions/checkout@v7
        with:
          repository: guanzhi/GmSSL
          ref: v3.2.0
          path: _deps/GmSSL
      - name: Build GmSSL 3.2.0
        run: |
          cmake -S _deps/GmSSL -B _deps/gmssl-build \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX=${{ runner.temp }}/gmssl \
            -DCMAKE_INSTALL_LIBDIR=lib
          cmake --build _deps/gmssl-build --parallel 2
          cmake --install _deps/gmssl-build
      - name: Test GmSSL security, wire, and transport
        env:
          CGO_ENABLED: "1"
          CGO_CFLAGS: -I${{ runner.temp }}/gmssl/include
          CGO_LDFLAGS: -L${{ runner.temp }}/gmssl/lib
          LD_LIBRARY_PATH: ${{ runner.temp }}/gmssl/lib
        run: go test -tags gmssl -count=1 ./secure/gmssl ./wire ./transport

  cross-compile:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: arm64
            package: ./epoll
            output: epoll-linux-arm64.test
          - goos: linux
            goarch: "386"
            package: ./epoll
            output: epoll-linux-386.test
          - goos: linux
            goarch: riscv64
            package: ./epoll
            output: epoll-linux-riscv64.test
          - goos: windows
            goarch: arm64
            package: ./iocp
            output: iocp-windows-arm64.test.exe
          - goos: darwin
            goarch: amd64
            package: ./kqueue
            output: kqueue-darwin-amd64.test
          - goos: darwin
            goarch: arm64
            package: ./kqueue
            output: kqueue-darwin-arm64.test
          - goos: freebsd
            goarch: amd64
            package: ./kqueue
            output: kqueue-freebsd-amd64.test
          - goos: freebsd
            goarch: arm64
            package: ./kqueue
            output: kqueue-freebsd-arm64.test
          - goos: freebsd
            goarch: riscv64
            package: ./kqueue
            output: kqueue-freebsd-riscv64.test
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.26.x"
          cache: true
      - name: Cross-compile target tests
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: go test -c ${{ matrix.package }} -o ${{ runner.temp }}/${{ matrix.output }}
