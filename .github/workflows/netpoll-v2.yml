name: ogrenet

on:
  push:
    branches: [master, feat/unified-transport-security]
  pull_request:

permissions:
  contents: read

jobs:
  linux:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        go: ["1.25.x", "1.26.x"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ matrix.go }}
          cache: true
      - name: Format
        run: |
          gofmt -w .
          git diff --exit-code
      - name: Module hygiene
        run: go mod tidy && git diff --exit-code -- go.mod go.sum
      - name: Vet
        run: go vet ./...
      - name: Test with race detector
        run: go test -race -count=1 ./...

  windows:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.26.x"
          cache: true
      - run: go vet ./...
      - run: go test -count=1 ./...

  macos:
    runs-on: macos-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.26.x"
          cache: true
      - run: go vet ./...
      - run: go test -count=1 ./...

  gmssl:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.26.x"
          cache: true
      - uses: actions/checkout@v7
        with:
          repository: guanzhi/GmSSL
          ref: v3.2.0
          path: _deps/GmSSL
      - name: Build GmSSL 3.2.0
        run: |
          cmake -S _deps/GmSSL -B _deps/gmssl-build \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX=${{ runner.temp }}/gmssl \
            -DCMAKE_INSTALL_LIBDIR=lib
          cmake --build _deps/gmssl-build --parallel 2
          cmake --install _deps/gmssl-build
      - name: Test GmSSL security, wire, and transport
        env:
          CGO_ENABLED: "1"
          CGO_CFLAGS: -I${{ runner.temp }}/gmssl/include
          CGO_LDFLAGS: -L${{ runner.temp }}/gmssl/lib
          LD_LIBRARY_PATH: ${{ runner.temp }}/gmssl/lib
        run: go test -tags gmssl -count=1 ./secure/gmssl ./wire ./transport

  cross-compile:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: arm64
            package: ./epoll
            output: epoll-linux-arm64.test
          - goos: linux
            goarch: "386"
            package: ./epoll
            output: epoll-linux-386.test
          - goos: linux
            goarch: riscv64
            package: ./epoll
            output: epoll-linux-riscv64.test
          - goos: windows
            goarch: arm64
            package: ./iocp
            output: iocp-windows-arm64.test.exe
          - goos: darwin
            goarch: amd64
            package: ./kqueue
            output: kqueue-darwin-amd64.test
          - goos: darwin
            goarch: arm64
            package: ./kqueue
            output: kqueue-darwin-arm64.test
          - goos: freebsd
            goarch: amd64
            package: ./kqueue
            output: kqueue-freebsd-amd64.test
          - goos: freebsd
            goarch: arm64
            package: ./kqueue
            output: kqueue-freebsd-arm64.test
          - goos: freebsd
            goarch: riscv64
            package: ./kqueue
            output: kqueue-freebsd-riscv64.test
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.26.x"
          cache: true
      - name: Cross-compile target tests
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: go test -c ${{ matrix.package }} -o ${{ runner.temp }}/${{ matrix.output }}
