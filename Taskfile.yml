version: 3
env:
  CGO_ENABLED: 0
  GOOS: "linux"
  GOARCH: "amd64"
  GOPROXY: https://proxy.golang.org,direct

vars:
  LD_FLAGS: "-s -w"

includes:
  golang: tasks/golang.yml
  client: example/client/client_example.yml
  server: example/server/server_example.yml

tasks:
  format:
    desc: format code
    cmds:
      - gofumpt -l -w ./

  default:
    cmds:
      - task -l
    silent: true
