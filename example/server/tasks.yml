version: 3
tasks:
  tcp:build:
    desc: tcp server example
    cmds:
      - go build -ldflags "${LD_FLAGS}" -o bin/server_example  example/server/tcp/*.go
  tcp:run:
    desc: tcp server example
    cmds:
      - go run -ldflags "${LD_FLAGS}"   example/server/tcp/*.go
  tls:
    desc: tcp server tls
    cmds:
      - go build -ldflags "${LD_FLAGS}" -o bin/server_tls  example/server/tls/*.go

  udp:
    desc: udp server
    cmds:
      - go build -ldflags "${LD_FLAGS}" -o bin/server_udp  example/server/udp/*.go
