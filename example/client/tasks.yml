version: 3
tasks:
  basic:
    desc: client example
    cmds:
      - go build -ldflags "${LD_FLAGS}" -o bin/client_example  example/client/basic/*.go
  tls:
    desc: client tls
    cmds:
      - go build -ldflags "${LD_FLAGS}" -o bin/client_tls  example/client/tls/*.go
  easy:
    desc: client buffer
    cmds:
      - go build -ldflags "${LD_FLAGS}" -o bin/client_easy  example/client/easy/*.go
